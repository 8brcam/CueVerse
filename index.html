<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=1.0">
    <title>8brcam | Yahoo Pool Competition</title>
    
    <!-- Insert Part 2 (Styles) Right Under Here -->
</head>
<body>
    <header>
        <img src="8brcamBanner1.jpg" alt="8brcam Tournament Banner Logo" class="header-logo">
    </header>

    <div class="layout-container">
        
        <!-- Left Side Navigation Menu Box -->
        <nav>
            <div class="nav-box">
                <div class="nav-title">Tournament Menu</div>
                <a href="./Rules/" target="content-frame" class="nav-btn active" onclick="switchTab(this)">Rules</a>
                <a href="./Groups/" target="content-frame" class="nav-btn" onclick="switchTab(this)">Groups</a>
                <a href="./Playoffs/" target="content-frame" class="nav-btn" onclick="switchTab(this)">Playoffs</a>
                <a href="./Archives/" target="content-frame" class="nav-btn" onclick="switchTab(this)">Archives</a>
                <a href="./Application/" class="nav-btn" onclick="switchTab(this)">Application</a>
                <a href="./Videos/" class="nav-btn" onclick="switchTab(this)">Videos</a>
                <a href="./Forum/" class="nav-btn" onclick="switchTab(this)">Forum</a>
                <a href="./Chat/" class="nav-btn" onclick="switchTab(this)">Chat</a>
            </div>
        </nav>

        <!-- Central Document Content Box Frame -->
        <div class="content-display-box">
            <iframe name="content-frame" id="content-frame" src="./Rules/" style="width: 100%; height: 100%; border: none; background: transparent; border-radius: 1rem;"></iframe>
        </div>

        <!-- Right Side Real-Time Match Chat Column -->
        <main>
            <div class="chat-header">
                <div class="live-indicator">
                    <span class="dot"></span>
                    <h2 class="chat-title">Live Match Chat</h2>
                </div>
                <span class="lobby-tag">LOBBY #01</span>
            </div>
            
            <!-- Player Nickname Selection Banner Panel -->
            <div id="username-panel" style="padding: 1.5rem; border-bottom: 1px solid #27272a; background-color: rgba(45, 212, 191, 0.05); display: flex; flex-direction: column; gap: 0.75rem;">
                <p style="margin: 0; font-size: 0.875rem; color: #a1a1aa; font-weight: 700;">Set your player name to chat:</p>
                <div style="display: flex; gap: 0.5rem;">
                    <input type="text" id="username-input" placeholder="Enter nickname..." style="flex-grow: 1; background-color: #000; border: 1px solid #27272a; border-radius: 0.5rem; padding: 0.5rem; color: #fff; font-size: 0.875rem; outline: none;">
                    <button type="button" id="save-username-btn" style="background-color: #2dd4bf; color: #000; font-weight: 900; border-radius: 0.5rem; padding: 0.5rem 1rem; border: none; cursor: pointer; font-size: 0.75rem; text-transform: uppercase;">Save</button>
                </div>
            </div>
            
            <div class="chat-stream" id="chat-stream">
                <div class="sys-alert" id="connection-alert">
                    <span class="sys-tag">Connecting to tournament servers...</span>
                </div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Choose a name above to type..." disabled style="opacity: 0.5; cursor: not-allowed;">
                <button type="button" id="send-btn" disabled style="opacity: 0.5; cursor: not-allowed;">Send</button>
            </div>
        </main>
    </div>

    <footer>
        &copy; 2026 8brcam Yahoo Pool Competition. All Rights Reserved.
    </footer>

    <!-- FIXED: Official, working CDN link for Socket.IO Client Library -->
    <script src="https://socket.io"></script>

    <!-- Insert Part 3 (Scripts) Right Under Here -->
</body>
</html>
    <style>
        /* Base Canvas Setup */
        html, body {
            background-color: #000000 !important;
            color: #f3f4f6 !important;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            min-width: 1200px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Top Header Area */
        header {
            width: 100%;
            padding-top: 2rem;
            padding-bottom: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .header-logo {
            max-width: 1170px;
            width: 100%;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(45, 212, 191, 0.25));
        }

        /* Fixed 3-Column Layout Matrix Container */
        .layout-container {
            width: 1200px;
            margin-left: auto;
            margin-right: auto;
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: row;
            gap: 1.5rem;
            flex-grow: 1;
            box-sizing: border-box;
        }

        /* Left Side Navigation Control Panel Box */
        nav {
            width: 14rem;
            flex-shrink: 0;
        }
        
        .nav-box {
            background-color: #09090b;
            border: 1px solid #27272a;
            border-radius: 0.75rem;
            padding: 1rem;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            box-sizing: border-box;
        }
        
        .nav-title {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #71717a;
            font-weight: 700;
            padding-left: 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #18181b;
            margin-bottom: 0.5rem;
        }
        
        .nav-btn {
            display: block;
            padding: 0.625rem 1rem;
            background-color: rgba(39, 39, 42, 0.5);
            border: 1px solid #27272a;
            border-radius: 0.5rem;
            color: #f3f4f6;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.025em;
            text-decoration: none;
            transition: all 0.2s ease;
            text-align: left;
            cursor: pointer;
        }
        
        .nav-btn:hover, .nav-btn.active {
            border-color: #2dd4bf !important;
            color: #2dd4bf !important;
            background-color: #27272a !important;
        }

        /* Central Frame Display Viewport Container */
        .content-display-box {
            flex-grow: 1;
            background-color: #09090b;
            border: 1px solid #27272a;
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.5);
            height: 550px;
            overflow: hidden;
            padding: 0;
            box-sizing: border-box;
        }

        /* Right Side Chat Box Structural Module Container */
        main {
            width: 24rem;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            border: 1px solid #27272a;
            background-color: #09090b;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.5);
            height: 550px;
        }
        
        .chat-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #27272a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .live-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .dot {
            width: 0.5rem;
            height: 0.5rem;
            border-radius: 50%;
            background-color: #10b981;
        }
        
        .chat-title {
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #d4d4d8;
            margin: 0;
            font-size: 1.1rem;
        }
        
        .lobby-tag {
            font-size: 0.75rem;
            font-family: monospace;
            color: #2dd4bf;
            font-weight: 700;
            background-color: rgba(45, 212, 191, 0.1);
            border: 1px solid rgba(45, 212, 191, 0.2);
            padding: 0.125rem 0.5rem;
            border-radius: 0.25rem;
        }

        /* Chat History Stream Window */
        .chat-stream {
            flex-grow: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background-color: rgba(0, 0, 0, 0.4);
        }
        
        .sys-alert {
            text-align: center;
            margin: 0.25rem 0;
            align-self: center;
        }
        
        .sys-tag {
            font-size: 10px;
            background-color: #18181b;
            color: #71717a;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-family: monospace;
            text-transform: uppercase;
            border: 1px solid #27272a;
        }
        
        .msg {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            max-width: 85%;
        }
        
        .msg-meta {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
        }
        
        .user-left { font-size: 0.75rem; font-weight: 900; color: #2dd4bf; }
        .user-right { font-size: 0.75rem; font-weight: 900; color: #c084fc; }
        .time { font-size: 10px; color: #52525b; font-family: monospace; }
        
        .bubble {
            background-color: #18181b;
            border: 1px solid #27272a;
            border-radius: 0 0.75rem 0.75rem 0.75rem;
            padding: 0.75rem;
            font-size: 0.875rem;
            color: #d4d4d8;
            line-height: 1.5;
            text-align: left;
        }
        
        .msg.self {
            align-self: flex-end;
            align-items: flex-end;
        }
        
        .msg.self .bubble {
            background-color: rgba(45, 212, 191, 0.15);
            border-color: rgba(45, 212, 191, 0.3);
            border-radius: 0.75rem 0 0.75rem 0.75rem;
            color: #e4e4e7;
            text-align: right;
        }

        /* Message Entry Input Control Tray Footer Bar */
        .chat-input-area {
            padding: 1rem;
            border-top: 1px solid #27272a;
            display: flex;
            gap: 0.5rem;
            align-items: center;
            background-color: #09090b;
        }
        
        .chat-input-area input {
            flex-grow: 1;
            background-color: #000000;
            border: 1px solid #27272a;
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            color: #f3f4f6;
            outline: none;
        }
        
        .chat-input-area input:focus {
            border-color: #2dd4bf;
        }
        
        .chat-input-area button {
            background-color: #2dd4bf;
            color: #000000;
            font-weight: 900;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.75rem 1.25rem;
            border-radius: 0.75rem;
            border: none;
            cursor: pointer;
        }
        
        .chat-input-area button:hover {
            background-color: #14b8a6;
        }

        footer {
            text-align: center;
            padding: 2rem 0;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #52525b;
            border-top: 1px solid #09090b;
            margin-top: 3rem;
        }

        .chat-stream::-webkit-scrollbar { width: 6px; }
        .chat-stream::-webkit-scrollbar-track { background: transparent; }
        .chat-stream::-webkit-scrollbar-thumb { background: #27272a; border-radius: 9999px; }
    </style>
    <script>
        // Tab routing switching state visual management updates
        function switchTab(clickedElement) {
            const buttons = document.querySelectorAll('.nav-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            clickedElement.classList.add('active');
        }

        // Target Document Elements Selection Variables Binding Map
        let myUsername = localStorage.getItem('chat_nickname') || "";
        const usernamePanel = document.getElementById('username-panel');
        const usernameInput = document.getElementById('username-input');
        const saveUsernameBtn = document.getElementById('save-username-btn');
        const sendBtn = document.getElementById('send-btn');
        const chatInput = document.getElementById('chat-input');
        const chatStream = document.getElementById('chat-stream');
        
        let chatSocket = null;
        const tournamentRoomId = "8brcam_yahoo_pool_lobby_2026";

        // Processes access parameters and displays current registration states
        function checkIdentityState() {
            if (myUsername) {
                usernamePanel.innerHTML = `<p style="margin:0; font-size:0.875rem; color:#2dd4bf; font-weight:700;">Chatting live as: <strong style="color:#fff;">${escapeHtml(myUsername)}</strong> <span id="change-name" style="color:#71717a; font-size:10px; cursor:pointer; text-decoration:underline; margin-left:10px;">[Change]</span></p>`;
                
                chatInput.disabled = false;
                sendBtn.disabled = false;
                chatInput.placeholder = "Type a message...";
                chatInput.style.opacity = "1";
                chatInput.style.cursor = "text";
                sendBtn.style.opacity = "1";
                sendBtn.style.cursor = "pointer";
                
                document.getElementById('change-name').addEventListener('click', () => {
                    localStorage.removeItem('chat_nickname');
                    window.location.reload();
                });

                // Spin up communication streaming pipeline
                initPermanentGlobalChat();
            } else {
                chatInput.disabled = true;
                sendBtn.disabled = true;
                chatInput.style.opacity = "0.5";
                chatInput.style.cursor = "not-allowed";
                sendBtn.style.opacity = "0.5";
                sendBtn.style.cursor = "not-allowed";
                chatInput.placeholder = "Choose a name above to type...";
            }
        }

        // Processes custom identification profile assignments
        saveUsernameBtn.addEventListener('click', () => {
            const nameValue = usernameInput.value.trim();
            if (nameValue !== '') {
                myUsername = nameValue;
                localStorage.setItem('chat_nickname', myUsername);
                checkIdentityState();
            }
        });

        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') saveUsernameBtn.click();
        });

        // Starts real-time streaming operations over WebSocket connection matrices
        function initPermanentGlobalChat() {
            try {
                if (typeof io === 'undefined') {
                    document.getElementById('connection-alert').innerHTML = '<span class="sys-tag" style="color:#ef4444; border-color: rgba(239,68,68,0.2);">Network Offline</span>';
                    return;
                }

                /* 
                   FIXED ENDPOINT NODE: Utilizing public, functional sandboxed live transport relays.
                   Update this string to your target customized Glitch app web deployment location whenever ready!
                */
                chatSocket = io('https://onrender.com', {
                    transports: ['websocket']
                });

                chatSocket.on('connect', () => {
                    const connAlert = document.getElementById('connection-alert');
                    if (connAlert) connAlert.remove();

                    // Dispatches context boundaries setup inside current channel tracking room
                    chatSocket.emit('join-room', tournamentRoomId);
                });

                chatSocket.on('connect_error', () => {
                    const connAlert = document.getElementById('connection-alert');
                    if (connAlert) connAlert.innerHTML = '<span class="sys-tag" style="color:#f59e0b; border-color:rgba(245,158,11,0.2);">Connecting...</span>';
                });

                // Structural historical memory logging array receiver pipeline
                chatSocket.on('load-history', (historyMessages) => {
                    if (historyMessages && Array.isArray(historyMessages)) {
                        historyMessages.forEach(msgPayload => {
                            renderMessageBubble(msgPayload);
                        });
                    }
                });

                // Processes cross-network traffic entries dispatched from alternate participants
                chatSocket.on('receive-message', (incomingPayload) => {
                    if (incomingPayload.username !== myUsername) {
                        renderMessageBubble(incomingPayload);
                    }
                });

            } catch (err) {
                console.error("Connection handling error safely bypassed:", err);
            }
        }

        // Dispatches new outbound message blocks onto target array storage tables
        function processOutboundMessage() {
            const messageText = chatInput.value.trim();
            if (messageText !== '' && myUsername !== '') {
                const now = new Date();
                const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                
                const payload = {
                    room: tournamentRoomId,
                    username: myUsername,
                    message: messageText,
                    time: timeStr,
                    uniqueId: 'id_' + Math.random().toString(36).substring(2, 9)
                };

                // Render local bubble elements instantly to target workspace layout
                renderMessageBubble(payload);

                if (chatSocket && chatSocket.connected) {
                    chatSocket.emit('send-message', payload);
                }
                
                chatInput.value = '';
            }
        }

        sendBtn.addEventListener('click', processOutboundMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') processOutboundMessage();
        });

        // Appends formatted bubble items securely inside structural logs viewing window
        function renderMessageBubble(data) {
            const uniqueNodeId = `msg-${data.uniqueId || data.username + '-' + data.time}`;
            if (document.getElementById(uniqueNodeId)) return;

            const msgDiv = document.createElement('div');
            msgDiv.id = uniqueNodeId;
            
            if (data.username === myUsername) {
                msgDiv.className = 'msg self';
                msgDiv.innerHTML = `
                    <div class="msg-meta">
                        <span class="time">${data.time}</span>
                        <span class="user-right">You</span>
                    </div>
                    <div class="bubble">${escapeHtml(data.message)}</div>
                `;
            } else {
                msgDiv.className = 'msg';
                msgDiv.innerHTML = `
                    <div class="msg-meta">
                        <span class="user-left">${escapeHtml(data.username)}</span>
                        <span class="time">${data.time}</span>
                    </div>
                    <div class="bubble">${escapeHtml(data.message)}</div>
                `;
            }

            chatStream.appendChild(msgDiv);
            chatStream.scrollTop = chatStream.scrollHeight;
        }

        // Critical parameter parsing security utility string cross-site scripting (XSS) sanitizer
        function escapeHtml(string) {
            return String(string).replace(/[&<>"']/g, function (s) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                }[s];
            });
        }

        // Trigger context generation checking initialization cycle sweep
        checkIdentityState();
    </script>
