<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=1.0">
    <title>8brcam | Yahoo Pool Competition</title>
</head>
<body class="bg-black text-gray-100 antialiased min-h-screen min-w-[1200px] flex flex-col justify-between">

    <header class="w-full pt-8 pb-4 flex justify-center items-center">
        <img src="8brcamBanner.png" alt="8brcam Tournament Banner Logo" class="max-w-[1170px] w-full h-auto object-contain drop-shadow-[0_0_15px_rgba(45,212,191,0.25)]">
    </header>

    <!-- Fixed 3-Column Layout Grid Container -->
    <div class="w-[1200px] mx-auto px-4 py-6 flex flex-row gap-6 flex-grow box-border">
        
        <!-- Left Side Navigation Box -->
        <nav class="w-56 flex-shrink-0">
            <div class="bg-[#09090b] border border-[#27272a] rounded-xl p-4 shadow-2xl flex flex-col gap-2 h-[550px]">
                <div class="text-[10px] uppercase tracking-widest text-[#71717a] font-bold pl-3 pb-2 border-b border-[#18181b] mb-2">
                    Tournament Menu
                </div>
                
                <!-- Open inside content box iframe -->
                <a href="./Rules/" target="content-frame" class="block px-4 py-2.5 bg-[#27272a]/50 border border-[#27272a] rounded-lg text-gray-200 text-2xl font-bold tracking-wide text-left cursor-pointer border-[#2dd4bf] text-[#2dd4bf] bg-[#27272a]">Rules</a>
                <a href="./Groups/" target="content-frame" class="block px-4 py-2.5 bg-[#27272a]/50 border border-[#27272a] rounded-lg text-gray-200 text-2xl font-bold tracking-wide text-left cursor-pointer hover:border-[#2dd4bf] hover:text-[#2dd4bf] hover:bg-[#27272a]">Groups</a>
                <a href="./Playoffs/" target="content-frame" class="block px-4 py-2.5 bg-[#27272a]/50 border border-[#27272a] rounded-lg text-gray-200 text-2xl font-bold tracking-wide text-left cursor-pointer hover:border-[#2dd4bf] hover:text-[#2dd4bf] hover:bg-[#27272a]">Playoffs</a>
                <a href="./Archives/" target="content-frame" class="block px-4 py-2.5 bg-[#27272a]/50 border border-[#27272a] rounded-lg text-gray-200 text-2xl font-bold tracking-wide text-left cursor-pointer hover:border-[#2dd4bf] hover:text-[#2dd4bf] hover:bg-[#27272a]">Archives</a>
                
                <!-- Open in external browser tabs -->
                <a href="https://google.com" target="_blank" class="block px-4 py-2.5 bg-[#27272a]/50 border border-[#27272a] rounded-lg text-gray-200 text-2xl font-bold tracking-wide text-left cursor-pointer hover:border-[#2dd4bf] hover:text-[#2dd4bf] hover:bg-[#27272a]">Application</a>
                <a href="https://youtube.com" target="_blank" class="block px-4 py-2.5 bg-[#27272a]/50 border border-[#27272a] rounded-lg text-gray-200 text-2xl font-bold tracking-wide text-left cursor-pointer hover:border-[#2dd4bf] hover:text-[#2dd4bf] hover:bg-[#27272a]">Videos</a>
                <a href="https://github.com" target="_blank" class="block px-4 py-2.5 bg-[#27272a]/50 border border-[#27272a] rounded-lg text-gray-200 text-2xl font-bold tracking-wide text-left cursor-pointer hover:border-[#2dd4bf] hover:text-[#2dd4bf] hover:bg-[#27272a]">Forum</a>
                <a href="https://twitch.tv" target="_blank" class="block px-4 py-2.5 bg-[#27272a]/50 border border-[#27272a] rounded-lg text-gray-200 text-2xl font-bold tracking-wide text-left cursor-pointer hover:border-[#2dd4bf] hover:text-[#2dd4bf] hover:bg-[#27272a]">Chat</a>
            </div>
        </nav>

        <!-- Central Content Box Frame (Now using explicit Tailwind height/width so it renders in Play) -->
        <div class="flex-grow bg-[#09090b] border border-[#27272a] rounded-2xl shadow-2xl h-[550px] overflow-hidden p-0 box-border">
            <iframe name="content-frame" id="content-frame" src="./Rules/" class="w-full h-full border-none bg-transparent rounded-2xl"></iframe>
        </div>

        <!-- Right Side Chat Box Frame -->
        <main class="w-96 flex-shrink-0 flex flex-col border border-[#27272a] bg-[#09090b] rounded-2xl overflow-hidden shadow-2xl h-[550px]">
            <div class="px-6 py-4 border-b border-[#27272a] flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-[#10b981]"></span>
                    <h2 class="font-bold tracking-wider uppercase text-[#d4d4d8] m-0">Live Match Chat</h2>
                </div>
                <span class="text-xs font-mono text-[#2dd4bf] font-bold bg-[#2dd4bf]/10 border border-[#2dd4bf]/20 px-2 py-0.5 rounded">LOBBY #01</span>
            </div>
            
            <div class="flex-grow p-6 overflow-y-auto flex flex-col gap-4 bg-black/40" id="chat-stream">
                <div class="text-center my-1 self-center">
                    <span class="text-[10px] bg-[#18181b] text-[#71717a] px-3 py-1 rounded-full font-mono uppercase border border-[#27272a]">Welcome to Yahoo Pool Lobby</span>
                </div>
                
                <div class="flex flex-col gap-1 max-w-[85%]">
                    <div class="flex items-baseline gap-2">
                        <span class="text-xs font-black text-[#2dd4bf]">Player_One</span>
                        <span class="text-[10px] text-[#52525b] font-mono">10:42 AM</span>
                    </div>
                    <div class="bg-[#18181b] border border-[#27272a] rounded-tr-xl rounded-br-xl rounded-bl-xl p-3 text-sm text-[#d4d4d8] leading-relaxed text-left">Good luck in the competition everyone!</div>
                </div>

                <div class="flex flex-col gap-1 max-w-[85%] self-end items-end">
                    <div class="flex items-baseline gap-2">
                        <span class="text-[10px] text-[#52525b] font-mono">10:43 AM</span>
                        <span class="text-xs font-black text-[#c084fc]">You</span>
                    </div>
                    <div class="bg-[#2dd4bf]/15 border border-[#2dd4bf]/30 rounded-tl-xl rounded-br-xl rounded-bl-xl p-3 text-sm text-gray-200 leading-relaxed text-right">Thanks! Good luck to you too!</div>
                </div>
            </div>

            <div class="p-4 border-top border-[#27272a] flex gap-2 items-center bg-[#09090b]">
                <input type="text" id="chat-input" placeholder="Type a message..." class="flex-grow bg-black border border-[#27272a] rounded-xl px-4 py-3 text-sm text-gray-100 outline-none focus:border-[#2dd4bf]">
                <button type="button" id="send-btn" class="bg-[#2dd4bf] text-black font-black text-xs uppercase tracking-wider px-5 py-3 rounded-xl border-none cursor-pointer hover:bg-[#14b8a6]">Send</button>
            </div>
        </main>
    </div>

    <footer class="text-center py-8 text-[10px] uppercase tracking-widest text-[#52525b] border-t border-[#09090b] mt-12">
        &copy; 2026 8brcam Yahoo Pool Competition. All Rights Reserved.
    </footer>

    <script>
        // Manages active visual layout clicks inside Tailwind Play framework
        function switchTab(clickedElement) {
            const buttons = document.querySelectorAll('nav a');
            buttons.forEach(btn => {
                btn.classList.remove('border-[#2dd4bf]', 'text-[#2dd4bf]', 'bg-[#27272a]');
                btn.classList.add('hover:border-[#2dd4bf]', 'hover:text-[#2dd4bf]', 'hover:bg-[#27272a]');
            });
            clickedElement.classList.add('border-[#2dd4bf]', 'text-[#2dd4bf]', 'bg-[#27272a]');
        }

        const sendBtn = document.getElementById('send-btn');
        const chatInput = document.getElementById('chat-input');
        const chatStream = document.getElementById('chat-stream');

        if(sendBtn && chatInput && chatStream) {
            sendBtn.addEventListener('click', () => {
                const messageText = chatInput.value.trim();
                if (messageText !== '') {
                    const msgDiv = document.createElement('div');
                    msgDiv.className = 'flex flex-col gap-1 max-w-[85%] self-end items-end';
                    
                    const now = new Date();
                    const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    
                    msgDiv.innerHTML = `
                        <div class="flex items-baseline gap-2">
                            <span class="text-[10px] text-[#52525b] font-mono">${timeStr}</span>
                            <span class="text-xs font-black text-[#c084fc]">You</span>
                        </div>
                        <div class="bg-[#2dd4bf]/15 border border-[#2dd4bf]/30 rounded-tl-xl rounded-br-xl rounded-bl-xl p-3 text-sm text-gray-200 leading-relaxed text-right">${messageText}</div>
                    `;
                    
                    chatStream.appendChild(msgDiv);
                    chatInput.value = '';
                    chatStream.scrollTop = chatStream.scrollHeight;
                }
            });

            chatInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    sendBtn.click();
                }
            });
        }
    </script>
</body>
</html>
