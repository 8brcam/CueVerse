<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=1.0">
    <title>8brcam | Yahoo Pool Competition</title>
    
    <style>
        /* Base Setup */
        html, body {
            background-color: #000000 !important;
            color: #f3f4f6 !important;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            min-width: 1200px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Top Header */
        header {
            width: 100%;
            padding-top: 2rem;
            padding-bottom: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .header-logo {
            max-width: 1170px;
            width: 100%;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(45, 212, 191, 0.25));
        }

        /* Fixed 3-Column Layout Grid */
        .layout-container {
            width: 1200px;
            margin-left: auto;
            margin-right: auto;
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: row;
            gap: 1.5rem;
            flex-grow: 1;
            box-sizing: border-box;
        }

        /* Left Side Navigation Box */
        nav {
            width: 14rem;
            flex-shrink: 0;
        }
        
        .nav-box {
            background-color: #09090b;
            border: 1px solid #27272a;
            border-radius: 0.75rem;
            padding: 1rem;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            box-sizing: border-box;
        }
        
        .nav-title {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #71717a;
            font-weight: 700;
            padding-left: 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #18181b;
            margin-bottom: 0.5rem;
        }
        
        .nav-btn {
            display: block;
            padding: 0.625rem 1rem;
            background-color: rgba(39, 39, 42, 0.5);
            border: 1px solid #27272a;
            border-radius: 0.5rem;
            color: #f3f4f6;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.025em;
            text-decoration: none;
            transition: all 0.2s ease;
            text-align: left;
            cursor: pointer;
        }
        
        .nav-btn:hover, .nav-btn.active {
            border-color: #2dd4bf !important;
            color: #2dd4bf !important;
            background-color: #27272a !important;
        }

        /* Central Content Box Frame */
        .content-display-box {
            flex-grow: 1;
            background-color: #09090b;
            border: 1px solid #27272a;
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.5);
            height: 550px;
            overflow: hidden;
            padding: 0;
            box-sizing: border-box;
        }

        /* Right Side Chat Box Frame */
        main {
            width: 24rem;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            border: 1px solid #27272a;
            background-color: #09090b;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.5);
            height: 550px;
        }
        
        .chat-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #27272a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .live-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .dot {
            width: 0.5rem;
            height: 0.5rem;
            border-radius: 50%;
            background-color: #10b981;
        }
        
        .chat-title {
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #d4d4d8;
            margin: 0;
        }
        
        .lobby-tag {
            font-size: 0.75rem;
            font-family: monospace;
            color: #2dd4bf;
            font-weight: 700;
            background-color: rgba(45, 212, 191, 0.1);
            border: 1px solid rgba(45, 212, 191, 0.2);
            padding: 0.125rem 0.5rem;
            border-radius: 0.25rem;
        }

        /* Chat Stream */
        .chat-stream {
            flex-grow: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background-color: rgba(0, 0, 0, 0.4);
        }
        
        .sys-alert {
            text-align: center;
            margin: 0.25rem 0;
            align-self: center;
        }
        
        .sys-tag {
            font-size: 10px;
            background-color: #18181b;
            color: #71717a;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-family: monospace;
            text-transform: uppercase;
            border: 1px solid #27272a;
        }
        
        .msg {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            max-width: 85%;
        }
        
        .msg-meta {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
        }
        
        .user-left { font-size: 0.75rem; font-weight: 900; color: #2dd4bf; }
        .user-right { font-size: 0.75rem; font-weight: 900; color: #c084fc; }
        .time { font-size: 10px; color: #52525b; font-family: monospace; }
        
        .bubble {
            background-color: #18181b;
            border: 1px solid #27272a;
            border-radius: 0 0.75rem 0.75rem 0.75rem;
            padding: 0.75rem;
            font-size: 0.875rem;
            color: #d4d4d8;
            line-height: 1.5;
            text-align: left;
        }
        
        .msg.self {
            align-self: flex-end;
            align-items: flex-end;
        }
        
        .msg.self .bubble {
            background-color: rgba(45, 212, 191, 0.15);
            border-color: rgba(45, 212, 191, 0.3);
            border-radius: 0.75rem 0 0.75rem 0.75rem;
            color: #e4e4e7;
            text-align: right;
        }

        /* Chat Input Box Fixed Frame */
        .chat-input-area {
            padding: 1rem;
            border-top: 1px solid #27272a;
            display: flex;
            gap: 0.5rem;
            align-items: center;
            background-color: #09090b;
        }
        
        .chat-input-area input {
            flex-grow: 1;
            background-color: #000000;
            border: 1px solid #27272a;
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            color: #f3f4f6;
            outline: none;
        }
        
        .chat-input-area input:focus {
            border-color: #2dd4bf;
        }
        
        .chat-input-area button {
            background-color: #2dd4bf;
            color: #000000;
            font-weight: 900;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.75rem 1.25rem;
            border-radius: 0.75rem;
            border: none;
            cursor: pointer;
        }
        
        .chat-input-area button:hover {
            background-color: #14b8a6;
        }

        footer {
            text-align: center;
            padding: 2rem 0;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #52525b;
            border-top: 1px solid #09090b;
            margin-top: 3rem;
        }

        .chat-stream::-webkit-scrollbar { width: 6px; }
        .chat-stream::-webkit-scrollbar-track { background: transparent; }
        .chat-stream::-webkit-scrollbar-thumb { background: #27272a; border-radius: 9999px; }
    </style>
</head>
<body>
    <header>
        <img src="8brcamBanner.png" alt="8brcam Tournament Banner Logo" class="header-logo">
    </header>

    <div class="layout-container">
        
        <!-- Left Side Navigation Box with all 8 buttons completely visible -->
        <nav>
            <div class="nav-box">
                <div class="nav-title">Tournament Menu</div>
                
                <!-- 4 BUTTONS FOR INSIDE: These open inside the context box -->
                <a href="./Rules/" target="content-frame" class="nav-btn active" onclick="switchTab(this)">Rules</a>
                <a href="./Groups/" target="content-frame" class="nav-btn" onclick="switchTab(this)">Groups</a>
                <a href="./Playoffs/" target="content-frame" class="nav-btn" onclick="switchTab(this)">Playoffs</a>
                <a href="./Archives/" target="content-frame" class="nav-btn" onclick="switchTab(this)">Archives</a>
                
                <!-- 4 BUTTONS FOR OUTSIDE: These open normal links outside the context box -->
                <a href="./Application/" class="nav-btn" onclick="switchTab(this)">Application</a>
                <a href="./Videos/" class="nav-btn" onclick="switchTab(this)">Videos</a>
                <a href="./Forum/" class="nav-btn" onclick="switchTab(this)">Forum</a>
                <a href="./Chat/" class="nav-btn" onclick="switchTab(this)">Chat</a>
            </div>
        </nav>

        <!-- Central Content Box Frame -->
        <div class="content-display-box">
            <iframe name="content-frame" id="content-frame" src="./Rules/" style="width: 100%; height: 100%; border: none; background: transparent; border-radius: 1rem;"></iframe>
        </div>
        <!-- Right Side Live Match Chat Column -->
        <main>
            <div class="chat-header">
                <div class="live-indicator">
                    <span class="dot"></span>
                    <h2 class="chat-title">Live Match Chat</h2>
                </div>
                <span class="lobby-tag">LOBBY #01</span>
            </div>
            
            <div class="chat-stream" id="chat-stream">
                <div class="sys-alert">
                    <span class="sys-tag">Welcome to Yahoo Pool Lobby</span>
                </div>
                
                <div class="msg">
                    <div class="msg-meta">
                        <span class="user-left">Player_One</span>
                        <span class="time">10:42 AM</span>
                    </div>
                    <div class="bubble">Good luck in the competition everyone!</div>
                </div>

                <div class="msg self">
                    <div class="msg-meta">
                        <span class="time">10:43 AM</span>
                        <span class="user-right">You</span>
                    </div>
                    <div class="bubble">Thanks! Good luck to you too!</div>
                </div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Type a message...">
                <button type="button" id="send-btn">Send</button>
            </div>
        </main>
    </div>

    <footer>
        &copy; 2026 8brcam Yahoo Pool Competition. All Rights Reserved.
    </footer>

    <script>
        // Manages UI navigation highlighting states cleanly
        function switchTab(clickedElement) {
            const buttons = document.querySelectorAll('.nav-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            clickedElement.classList.add('active');
        }

        // Live Chat box message generator engine
        const sendBtn = document.getElementById('send-btn');
        const chatInput = document.getElementById('chat-input');
        const chatStream = document.getElementById('chat-stream');

        if(sendBtn && chatInput && chatStream) {
            sendBtn.addEventListener('click', () => {
                const messageText = chatInput.value.trim();
                if (messageText !== '') {
                    const msgDiv = document.createElement('div');
                    msgDiv.className = 'msg self';
                    
                    const now = new Date();
                    const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    
                    msgDiv.innerHTML = `
                        <div class="msg-meta">
                            <span class="time">${timeStr}</span>
                            <span class="user-right">You</span>
                        </div>
                        <div class="bubble">${messageText}</div>
                    `;
                    
                    chatStream.appendChild(msgDiv);
                    chatInput.value = '';
                    chatStream.scrollTop = chatStream.scrollHeight;
                }
            });

            chatInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    sendBtn.click();
                }
            });
        }
    </script>
</body>
</html>
