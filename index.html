<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8brcam | Yahoo Pool Competition</title>
    
    <!-- Load Firebase via secure networks -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <style>
        /* --- Base Setup --- */
        html, body {
            background-color: #000000 !important;
            color: #f3f4f6 !important;
            font-family: ui-sans-serif, system-ui, sans-serif;
            margin: 0; padding: 0; min-height: 100vh;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        header { width: 100%; padding: 2rem 0 1rem; display: flex; justify-content: center; }
        .header-logo { max-width: 1170px; width: 90%; height: auto; object-fit: contain; }

        /* --- Layout Grid --- */
        .layout-container {
            width: 100%; max-width: 1200px; margin: 0 auto; padding: 1rem;
            display: flex; flex-direction: column; gap: 1.25rem; flex-grow: 1; box-sizing: border-box;
        }

        /* --- Navigation & Buttons --- */
        nav { width: 100%; flex-shrink: 0; }
        .nav-box {
            background-color: #09090b; border: 1px solid #27272a; border-radius: 0.75rem;
            padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem;
        }
        .nav-title {
            font-size: 10px; text-transform: uppercase; letter-spacing: 0.15em; color: #71717a;
            font-weight: 700; padding-bottom: 0.5rem; border-bottom: 1px solid #18181b; margin-bottom: 0.5rem;
        }
        .nav-btn {
            display: block; padding: 0.625rem 1rem; background-color: rgba(39, 39, 42, 0.5);
            border: 1px solid #27272a; border-radius: 0.5rem; color: #f3f4f6;
            font-size: 1.2rem; font-weight: 700; text-decoration: none; text-align: left; cursor: pointer;
        }
        .nav-btn:hover, .nav-btn.active { border-color: #2dd4bf !important; color: #2dd4bf !important; background-color: #27272a !important; }

        /* --- Content Frame --- */
        .content-display-box { width: 100%; background-color: #09090b; border: 1px solid #27272a; border-radius: 1rem; height: 450px; overflow: hidden; }

        /* --- Right-Hand Sidebar Chat Panel --- */
        main { width: 100%; display: flex; flex-direction: column; border: 1px solid #27272a; background-color: #09090b; border-radius: 1rem; height: 550px; overflow: hidden; }
        .chat-header { padding: 1rem 1.5rem; border-bottom: 1px solid #27272a; display: flex; justify-content: space-between; align-items: center; }
        .live-indicator { display: flex; align-items: center; gap: 0.5rem; }
        .dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; background-color: #10b981; }
        .chat-title { font-weight: 700; color: #d4d4d8; margin: 0; font-size: 1.1rem; text-transform: uppercase; }
        .lobby-tag { font-size: 0.75rem; font-family: monospace; color: #2dd4bf; background-color: rgba(45, 212, 191, 0.1); border: 1px solid rgba(45, 212, 191, 0.2); padding: 0.125rem 0.5rem; border-radius: 0.25rem; }
        
        #username-panel { padding: 1rem; border-bottom: 1px solid #27272a; background-color: rgba(45, 212, 191, 0.05); display: flex; flex-direction: column; gap: 0.5rem; }
        #username-input { background-color: #000; border: 1px solid #27272a; border-radius: 0.5rem; padding: 0.5rem; color: #fff; outline: none; }
        #save-username-btn { background-color: #2dd4bf; color: #000; font-weight: 900; padding: 0.5rem 1rem; border-radius: 0.5rem; border: none; cursor: pointer; }
        
        .chat-stream { flex-grow: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; background-color: rgba(0, 0, 0, 0.4); }
        .sys-tag { font-size: 10px; background-color: #18181b; color: #71717a; padding: 0.25rem 0.75rem; border-radius: 9999px; border: 1px solid #27272a; }
        
        .msg { display: flex; flex-direction: column; gap: 0.25rem; max-width: 85%; }
        .msg.self { align-self: flex-end; items: flex-end; text-align: right; }
        .user-left { font-size: 0.75rem; font-weight: 900; color: #2dd4bf; }
        .user-right { font-size: 0.75rem; font-weight: 900; color: #c084fc; }
        .time { font-size: 10px; color: #52525b; font-family: monospace; margin: 0 5px; }
        .bubble { background-color: #18181b; border: 1px solid #27272a; border-radius: 0 0.75rem 0.75rem 0.75rem; padding: 0.75rem; font-size: 0.875rem; color: #d4d4d8; word-break: break-word; }
        .msg.self .bubble { background-color: rgba(45, 212, 191, 0.15); border-color: rgba(45, 212, 191, 0.3); border-radius: 0.75rem 0 0.75rem 0.75rem; }

        .chat-input-area { padding: 1rem; border-top: 1px solid #27272a; display: flex; gap: 0.5rem; background-color: #09090b; }
        .chat-input-area input { flex-grow: 1; background-color: #000; border: 1px solid #27272a; border-radius: 0.75rem; padding: 0.75rem; color: #fff; outline: none; }
        .chat-input-area button { background-color: #2dd4bf; color: #000; font-weight: 900; padding: 0.75rem 1.25rem; border-radius: 0.75rem; border: none; cursor: pointer; }
        input:disabled, button:disabled { opacity: 0.5; cursor: not-allowed !important; }

        footer { text-align: center; padding: 2rem 0; font-size: 10px; color: #52525b; border-top: 1px solid #09090b; margin-top: 3rem; }

        .chat-stream::-webkit-scrollbar { width: 6px; }
        .chat-stream::-webkit-scrollbar-track { background: transparent; }
        .chat-stream::-webkit-scrollbar-thumb { background: #27272a; border-radius: 9999px; }

        @media (min-width: 1024px) {
            .layout-container { flex-direction: row; }
            nav { width: 14rem; }
            .content-display-box { flex-grow: 1; height: 550px; }
            main { width: 24rem; height: 550px; }
        }
    </style>
</head>
<body>

    <header>
        <img src="8brcamBanner1.jpg" alt="8brcam Tournament Banner Logo" class="header-logo">
    </header>

    <div class="layout-container">
        <!-- Left Sidebar Navigation -->
        <nav>
            <div class="nav-box">
                <div class="nav-title">Tournament Menu</div>
                <a href="./Rules/" target="content-frame" class="nav-btn active" onclick="switchTab(this)">Rules</a>
                <a href="./Groups/" target="content-frame" class="nav-btn" onclick="switchTab(this)">Groups</a>
                <a href="./Playoffs/" target="content-frame" class="nav-btn" onclick="switchTab(this)">Playoffs</a>
                <a href="./Archives/" target="content-frame" class="nav-btn" onclick="switchTab(this)">Archives</a>
                <a href="./Application/" target="content-frame" class="nav-btn" onclick="switchTab(this)">Application</a>
                <a href="./Videos/" target="content-frame" class="nav-btn" onclick="switchTab(this)">Videos</a>
                <a href="./Forum/" target="content-frame" class="nav-btn" onclick="switchTab(this)">Forum</a>
                <a href="./Chat/" target="content-frame" class="nav-btn" onclick="switchTab(this)">Chat</a>
            </div>
        </nav>
        <!-- Center Content Window -->
        <div class="content-display-box">
            <iframe name="content-frame" id="content-frame" src="./Rules/" style="width: 100%; height: 100%; border: none; background: transparent;"></iframe>
        </div>

        <!-- Right Side Live Chat Frame -->
        <main>
            <div class="chat-header">
                <div class="live-indicator"><span class="dot"></span><h2 class="chat-title">Global Chat</h2></div>
                <span class="lobby-tag">LOBBY #01</span>
            </div>
            <div id="username-panel">
                <p style="margin: 0; font-size: 0.875rem; color: #a1a1aa; font-weight: 700;">Set player name to chat globally:</p>
                <div style="display: flex; gap: 0.5rem;">
                    <input type="text" id="username-input" placeholder="Enter nickname..." />
                    <button type="button" id="save-username-btn">Join</button>
                </div>
            </div>
            
            <div class="chat-stream" id="chat-stream">
                <div class="sys-alert" id="connection-alert"><span class="sys-tag">Connecting to global tournament servers...</span></div>
            </div>
            
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Choose a name above to type...">
                <button type="button" id="send-btn">Send</button>
            </div>
        </main>
    </div>
        
    <footer>
        &copy; 2026 8brcam Yahoo Pool Competition. All Rights Reserved.
    </footer>

    <!-- Mobile Screen Auto-Scroll Adjustment Script -->
    <script>
        function switchTab(element) {
            const buttons = document.querySelectorAll('.nav-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');

            if (window.innerWidth < 1024) {
                const contentBox = document.querySelector('.content-display-box');
                if (contentBox) {
                    contentBox.scrollIntoView({ 
                        behavior: 'smooth', 
                        block: 'start' 
                    });
                }
            }
        }
    </script>

    <!-- Global Firebase Connection Engine (Compat Script Mode) -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBROwwCrWBPx-1WmDuZROeG6sDmpfn44CE",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://firebaseio.com",
            projectId: "brcam-chat",
            storageBucket: "brcam-chat.firebasestorage.app",
            messagingSenderId: "82194034681",
            appId: "1:82194034681:web:bfb3dbe585c1e2601d9728"
        };

        // Initialize Firebase with global browser variables
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const chatRoomRef = db.ref("global_arenas/8brcam_lobby_2026");

        let myUsername = localStorage.getItem('chat_nickname') || "";
        const usernamePanel = document.getElementById('username-panel');
        const usernameInput = document.getElementById('username-input');
        const saveUsernameBtn = document.getElementById('save-username-btn');
        const sendBtn = document.getElementById('send-btn');
        const chatInput = document.getElementById('chat-input');
        const chatStream = document.getElementById('chat-stream');

        function checkIdentityState() {
            if (myUsername) {
                if (usernamePanel) {
                    usernamePanel.innerHTML = `<p style="margin:0; font-size:0.875rem; color:#2dd4bf; font-weight:700;">Chatting as: <strong style="color:#fff;">${escapeHtml(myUsername)}</strong> <span id="change-name" style="color:#71717a; font-size:10px; cursor:pointer; text-decoration:underline; margin-left:10px;">[Change]</span></p>`;
                    document.getElementById('change-name').addEventListener('click', () => {
                        localStorage.removeItem('chat_nickname'); window.location.reload();
                    });
                }
                if (chatInput) { chatInput.disabled = false; chatInput.placeholder = "Type a global message..."; chatInput.style.opacity = "1"; }
                if (sendBtn) { sendBtn.disabled = false; sendBtn.style.opacity = "1"; }
                initPermanentFirebaseChat();
            } else {
                if (chatInput) { chatInput.disabled = true; chatInput.placeholder = "Choose a name above..."; chatInput.style.opacity = "0.5"; }
                if (sendBtn) { sendBtn.disabled = true; sendBtn.style.opacity = "0.5"; }
            }
        }

        if (saveUsernameBtn) {
            saveUsernameBtn.addEventListener('click', () => {
                const nameValue = usernameInput.value.trim();
                if (nameValue !== '') { myUsername = nameValue; localStorage.setItem('chat_nickname', myUsername); checkIdentityState(); }
            });
        }
        if (usernameInput) { usernameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') saveUsernameBtn.click(); }); }

        function initPermanentFirebaseChat() {
            const connAlert = document.getElementById('connection-alert');
            if (connAlert) connAlert.innerHTML = '';

            chatRoomRef.limitToLast(50).on('child_added', (snapshot) => {
                renderMessageBubble({ ...snapshot.val(), uniqueId: snapshot.key });
            });
        }

        function processOutboundMessage() {
            const text = chatInput.value.trim();
            if (text !== '' && myUsername !== '') {
                const now = new Date();
                chatRoomRef.push({
                    username: myUsername, message: text,
                    time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
                chatInput.value = '';
            }
        }

        if (sendBtn) sendBtn.addEventListener('click', processOutboundMessage);
        if (chatInput) chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') processOutboundMessage(); });

        function renderMessageBubble(data) {
            const uniqueNodeId = `msg-${data.uniqueId}`;
            if (document.getElementById(uniqueNodeId)) return;
            const msgDiv = document.createElement('div'); msgDiv.id = uniqueNodeId;
            
            if (data.username === myUsername) {
                msgDiv.className = 'msg self';
                msgDiv.innerHTML = `<div class="msg-meta"><span class="time">${data.time}</span><span class="user-right">You</span></div><div class="bubble">${escapeHtml(data.message)}</div>`;
            } else {
                msgDiv.className = 'msg';
                msgDiv.innerHTML = `<div class="msg-meta"><span class="user-left">${escapeHtml(data.username)}</span><span class="time">${data.time}</span></div><div class="bubble">${escapeHtml(data.message)}</div>`;
            }
            chatStream.appendChild(msgDiv); chatStream.scrollTop = chatStream.scrollHeight;
        }

        function escapeHtml(string) { return String(string).replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s])); }
        checkIdentityState();
    </script>
</body>
</html>
