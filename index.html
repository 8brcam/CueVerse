<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=1.0">
    <title>8brcam | Yahoo Pool Competition</title>
    
    <style>
        /* Base Setup */
        html, body {
            background-color: #000000 !important;
            color: #f3f4f6 !important;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            min-width: 1200px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Top Header */
        header {
            width: 100%;
            padding-top: 2rem;
            padding-bottom: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .header-logo {
            max-width: 1170px;
            width: 100%;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(45, 212, 191, 0.25));
        }

        h1 {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 0.1em;
            color: #2dd4bf;
            margin: 0;
            filter: drop-shadow(0 0 15px rgba(45, 212, 191, 0.3));
        }

        /* Fixed 3-Column Layout Grid */
        .layout-container {
            width: 1200px;
            margin-left: auto;
            margin-right: auto;
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: row;
            gap: 1.5rem;
            flex-grow: 1;
            box-sizing: border-box;
        }

        /* Left Side Navigation Box */
        nav {
            width: 14rem;
            flex-shrink: 0;
        }
        
        .nav-box {
            background-color: #09090b;
            border: 1px solid #27272a;
            border-radius: 0.75rem;
            padding: 1rem;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            box-sizing: border-box;
        }
        
        .nav-title {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #71717a;
            font-weight: 700;
            padding-left: 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #18181b;
            margin-bottom: 0.5rem;
        }
        
        .nav-btn {
            display: block;
            padding: 0.625rem 1rem;
            background-color: rgba(39, 39, 42, 0.5);
            border: 1px solid #27272a;
            border-radius: 0.5rem;
            color: #f3f4f6;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.025em;
            text-decoration: none;
            transition: all 0.2s ease;
            text-align: left;
            cursor: pointer;
        }
        
        .nav-btn:hover, .nav-btn.active {
            border-color: #2dd4bf !important;
            color: #2dd4bf !important;
            background-color: #27272a !important;
        }
        /* Central Content Box Frame */
        .content-display-box {
            flex-grow: 1;
            background-color: #09090b;
            border: 1px solid #27272a;
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.5);
            height: 550px;
            overflow: hidden;
            padding: 0;
            box-sizing: border-box;
        }

        /* Right Side Chat Box Frame */
        main {
            width: 24rem;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            border: 1px solid #27272a;
            background-color: #09090b;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.5);
            height: 550px;
        }
        
        .chat-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #27272a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .live-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .dot {
            width: 0.5rem;
            height: 0.5rem;
            border-radius: 50%;
            background-color: #10b981;
        }
        
        .chat-title {
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #d4d4d8;
            margin: 0;
            font-size: 1.1rem;
        }
        
        .lobby-tag {
            font-size: 0.75rem;
            font-family: monospace;
            color: #2dd4bf;
            font-weight: 700;
            background-color: rgba(45, 212, 191, 0.1);
            border: 1px solid rgba(45, 212, 191, 0.2);
            padding: 0.125rem 0.5rem;
            border-radius: 0.25rem;
        }

        /* Chat Stream */
        .chat-stream {
            flex-grow: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background-color: rgba(0, 0, 0, 0.4);
        }
        
        .sys-alert {
            text-align: center;
            margin: 0.25rem 0;
            align-self: center;
        }
        
        .sys-tag {
            font-size: 10px;
            background-color: #18181b;
            color: #71717a;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-family: monospace;
            text-transform: uppercase;
            border: 1px solid #27272a;
        }
        
        .msg {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            max-width: 85%;
        }
        
        .msg-meta {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
        }
        
        .user-left { font-size: 0.75rem; font-weight: 900; color: #2dd4bf; }
        .user-right { font-size: 0.75rem; font-weight: 900; color: #c084fc; }
        .time { font-size: 10px; color: #52525b; font-family: monospace; }
        
        .bubble {
            background-color: #18181b;
            border: 1px solid #27272a;
            border-radius: 0 0.75rem 0.75rem 0.75rem;
            padding: 0.75rem;
            font-size: 0.875rem;
            color: #d4d4d8;
            line-height: 1.5;
            text-align: left;
        }
        
        .msg.self {
            align-self: flex-end;
            align-items: flex-end;
        }
        
        .msg.self .bubble {
            background-color: rgba(45, 212, 191, 0.15);
            border-color: rgba(45, 212, 191, 0.3);
            border-radius: 0.75rem 0 0.75rem 0.75rem;
            color: #e4e4e7;
            text-align: right;
        }

        /* Chat Input Area */
        .chat-input-area {
            padding: 1rem;
            border-top: 1px solid #27272a;
            display: flex;
            gap: 0.5rem;
            align-items: center;
            background-color: #09090b;
        }
        
        .chat-input-area input {
            flex-grow: 1;
            background-color: #000000;
            border: 1px solid #27272a;
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            color: #f3f4f6;
            outline: none;
        }
        
        .chat-input-area input:focus {
            border-color: #2dd4bf;
        }
        
        .chat-input-area button {
            background-color: #2dd4bf;
            color: #000000;
            font-weight: 900;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.75rem 1.25rem;
            border-radius: 0.75rem;
            border: none;
            cursor: pointer;
        }
        
        .chat-input-area button:hover {
            background-color: #14b8a6;
        }

        footer {
            text-align: center;
            padding: 2rem 0;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #52525b;
            border-top: 1px solid #09090b;
            margin-top: 3rem;
        }

        .chat-stream::-webkit-scrollbar { width: 6px; }
        .chat-stream::-webkit-scrollbar-track { background: transparent; }
        .chat-stream::-webkit-scrollbar-thumb { background: #27272a; border-radius: 9999px; }
    </style>
</head>
<body>
    <header>
        <img src="8brcamBanner1.jpg" alt="8brcam Tournament Banner Logo" class="header-logo">
    </header>

    <div class="layout-container">
        <nav>
            <div class="nav-box">
                <div class="nav-title">Tournament Menu</div>
                <a href="./Rules/" target="content-frame" class="nav-btn active" onclick="switchTab(this)">Rules</a>
                <a href="./Groups/" target="content-frame" class="nav-btn" onclick="switchTab(this)">Groups</a>
                <a href="./Playoffs/" target="content-frame" class="nav-btn" onclick="switchTab(this)">Playoffs</a>
                <a href="./Archives/" target="content-frame" class="nav-btn" onclick="switchTab(this)">Archives</a>
                <a href="./Application/" class="nav-btn" onclick="switchTab(this)">Application</a>
                <a href="./Videos/" class="nav-btn" onclick="switchTab(this)">Videos</a>
                <a href="./Forum/" class="nav-btn" onclick="switchTab(this)">Forum</a>
                <a href="./Chat/" class="nav-btn" onclick="switchTab(this)">Chat</a>
            </div>
        </nav>

        <div class="content-display-box">
            <iframe name="content-frame" id="content-frame" src="./Rules/" style="width: 100%; height: 100%; border: none; background: transparent; border-radius: 1rem;"></iframe>
        </div>

        <main>
            <div class="chat-header">
                <div class="live-indicator">
                    <span class="dot"></span>
                    <h2 class="chat-title">Live Match Chat</h2>
                </div>
                <span class="lobby-tag">LOBBY #01</span>
            </div>
            
            <div id="username-panel" style="padding: 1.5rem; border-bottom: 1px solid #27272a; background-color: rgba(45, 212, 191, 0.05); display: flex; flex-direction: column; gap: 0.75rem;">
                <p style="margin: 0; font-size: 0.875rem; color: #a1a1aa; font-weight: 700;">Set your player name to chat:</p>
                <div style="display: flex; gap: 0.5rem;">
                    <input type="text" id="username-input" placeholder="Enter nickname..." style="flex-grow: 1; background-color: #000; border: 1px solid #27272a; border-radius: 0.5rem; padding: 0.5rem; color: #fff; font-size: 0.875rem; outline: none;">
                    <button type="button" id="save-username-btn">Save</button>
                </div>
            </div>
            
            <div class="chat-stream" id="chat-stream">
                <div class="sys-alert" id="connection-alert">
                    <span class="sys-tag">Connecting to tournament servers...</span>
                </div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Choose a name above to type..." disabled style="opacity: 0.5; cursor: not-allowed;">
                <button type="button" id="send-btn" disabled style="opacity: 0.5; cursor: not-allowed;">Send</button>
            </div>
        </main>
    </div>

    <footer>
        &copy; 2026 8brcam Yahoo Pool Competition. All Rights Reserved.
    </footer>
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Room</title>
    <!-- Complete browser-supported Firebase SDK links -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
</head>
<body>

    <!-- Target containers must exist in your HTML body for these variables to bind -->
    <div id="username-panel"></div>
    <input type="text" id="username-input" placeholder="Enter username">
    <button id="save-username-btn">Save</button>
    <div id="chat-stream" style="height: 300px; overflow-y: auto;"></div>
    <input type="text" id="chat-input" placeholder="Type a message...">
    <button id="send-btn">Send</button>
    <div id="connection-alert"></div>

    <script>
        // Tab switching utility
        function switchTab(clickedElement) {
            const buttons = document.querySelectorAll('.nav-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            clickedElement.classList.add('active');
        }

        // State initialization & DOM bindings
        let myUsername = localStorage.getItem('chat_nickname') || "";
        const usernamePanel = document.getElementById('username-panel');
        const usernameInput = document.getElementById('username-input');
        const saveUsernameBtn = document.getElementById('save-username-btn');
        const sendBtn = document.getElementById('send-btn');
        const chatInput = document.getElementById('chat-input');
        const chatStream = document.getElementById('chat-stream');
        
        let dbRef = null;
        const tournamentRoomId = "8brcam_yahoo_pool_lobby_2026";
        // Manages UI states depending on whether user has chosen a nickname
        function checkIdentityState() {
            if (myUsername) {
                if (usernamePanel) {
                    usernamePanel.innerHTML = `<p style="margin:0; font-size:0.875rem; color:#2dd4bf; font-weight:700;">Chatting live as: <strong style="color:#fff;">${escapeHtml(myUsername)}</strong> <span id="change-name" style="color:#71717a; font-size:10px; cursor:pointer; text-decoration:underline; margin-left:10px;">[Change]</span></p>`;
                    
                    const changeNameLink = document.getElementById('change-name');
                    if (changeNameLink) {
                        changeNameLink.addEventListener('click', () => {
                            localStorage.removeItem('chat_nickname');
                            window.location.reload();
                        });
                    }
                }
                
                if (chatInput) {
                    chatInput.disabled = false;
                    chatInput.placeholder = "Type a message...";
                    chatInput.style.opacity = "1";
                    chatInput.style.cursor = "text";
                }
                if (sendBtn) {
                    sendBtn.disabled = false;
                    sendBtn.style.opacity = "1";
                    sendBtn.style.cursor = "pointer";
                }

                initPermanentFirebaseChat();
            } else {
                if (chatInput) {
                    chatInput.disabled = true;
                    chatInput.style.opacity = "0.5";
                    chatInput.style.cursor = "not-allowed";
                    chatInput.placeholder = "Choose a name above to type...";
                }
                if (sendBtn) {
                    sendBtn.disabled = true;
                    sendBtn.style.opacity = "0.5";
                    sendBtn.style.cursor = "not-allowed";
                }
            }
        }

        // Attach action handlers for login interface
        if (saveUsernameBtn) {
            saveUsernameBtn.addEventListener('click', () => {
                const nameValue = usernameInput ? usernameInput.value.trim() : '';
                if (nameValue !== '') {
                    myUsername = nameValue;
                    localStorage.setItem('chat_nickname', myUsername);
                    checkIdentityState();
                }
            });
        }

        if (usernameInput) {
            usernameInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && saveUsernameBtn) saveUsernameBtn.click();
            });
        }
        // Database Connector Engine
        function initPermanentFirebaseChat() {
            try {
                const firebaseConfig = {
                    apiKey: "AIzaSyBROwwCrWBPx-1WmDuZROeG6sDmpfn44CE",
                    authDomain: "://firebaseapp.com",
                    databaseURL: "https://firebaseio.com",
                    projectId: "brcam-chat",
                    storageBucket: "brcam-chat.firebasestorage.app",
                    messagingSenderId: "82194034681",
                    appId: "1:82194034681:web:6826aabf49732b981d9728"
                };

                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                
                dbRef = firebase.database().ref("chats/" + tournamentRoomId);

                const connAlert = document.getElementById('connection-alert');
                if (connAlert) connAlert.remove();

                dbRef.limitToLast(50).on("child_added", (snapshot) => {
                    const msgPayload = snapshot.val();
                    renderMessageBubble({
                        ...msgPayload,
                        uniqueId: snapshot.key
                    });
                });

            } catch (err) {
                console.error("Firebase setup error:", err);
                const connAlert = document.getElementById('connection-alert');
                if (connAlert) {
                    connAlert.innerHTML = '<span class="sys-tag" style="color:#ef4444; border-color: rgba(239,68,68,0.2);">Database Error</span>';
                }
            }
        }

        // Format and push message to live server
        function processOutboundMessage() {
            if (!chatInput) return;
            const messageText = chatInput.value.trim();
            if (messageText !== '' && myUsername !== '' && dbRef) {
                const now = new Date();
                const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                
                const payload = {
                    username: myUsername,
                    message: messageText,
                    time: timeStr,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                };

                dbRef.push(payload).catch(err => console.error("Cloud push failed:", err));
                chatInput.value = '';
            }
        }

        if (sendBtn) sendBtn.addEventListener('click', processOutboundMessage);
        if (chatInput) {
            chatInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') processOutboundMessage();
            });
        }

        // Create bubble components on screen
        function renderMessageBubble(data) {
            const uniqueNodeId = `msg-${data.uniqueId || data.username + '-' + data.time}`;
            if (document.getElementById(uniqueNodeId)) return;

            const msgDiv = document.createElement('div');
            msgDiv.id = uniqueNodeId;
            
            if (data.username === myUsername) {
                msgDiv.className = 'msg self';
                msgDiv.innerHTML = `
                    <div class="msg-meta"><span class="time">${data.time}</span><span class="user-right">You</span></div>
                    <div class="bubble">${escapeHtml(data.message)}</div>
                `;
            } else {
                msgDiv.className = 'msg';
                msgDiv.innerHTML = `
                    <div class="msg-meta"><span class="user-left">${escapeHtml(data.username)}</span><span class="time">${data.time}</span></div>
                    <div class="bubble">${escapeHtml(data.message)}</div>
                `;
            }

            if (chatStream) {
                chatStream.appendChild(msgDiv);
                chatStream.scrollTop = chatStream.scrollHeight;
            }
        }

        // FIXED: Replaced bad string token logic with correct HTML string escape
        function escapeHtml(string) {
            return String(string).replace(/[&<>"']/g, s => ({
                '&': '&amp;', 
                '<': '&lt;', 
                '>': '&gt;', 
                '"': '&quot;', 
                "'": '&#39;'
            }[s]));
        }

        // Initialize script logic
        checkIdentityState();
    </script>
</body>
</html>
