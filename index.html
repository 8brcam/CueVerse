<!DOCTYPE html>
<html lang="en" style="background-color: #000000 !important;">
<head>
    <!-- FORCES MOBILE DEVICES TO ZOOM OUT AND MATCH THE EXACT PC SCREEN MONITOR LAYOUT -->
    <meta name="viewport" content="width=1160, initial-scale=1.0, shrink-to-fit=no">
    <title>8brcam | Yahoo Pool Competition</title>
    
    <!-- Google Fonts import for Orbitron layout styling -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- Base Layout & Custom Radial Mesh Background --- */
        body {
            margin: 0;
            background-color: #000000 !important; 
            color: #ffffff; 
            padding: 20px 0; 
            font-family: 'Orbitron', -apple-system, sans-serif; 
            font-size: 11px; 
            width: 100% !important; 
            box-sizing: border-box; 
            background-image: radial-gradient(#1f2430 1px, transparent 0); 
            background-size: 16px 16px;
        }

        /* --- Master Alignment Block --- */
        .master-layout-alignment-block {
            width: 1160px; /* Comfortably holds 1120px content + 20px side cushions */
            margin: 0 auto;
            display: block;
            box-sizing: border-box;
            padding-top: 15px; 
            padding-left: 20px;
            padding-right: 20px;
            overflow: hidden; 
        }

        /* --- Header Logo Container Configuration with Game-Cyan 4-Way Moving Neon Glow --- */
        .main-top-header {
            width: 100%;
            margin-bottom: 0px; 
            box-sizing: border-box;
            display: flex;
            justify-content: center;
        }

        /* Balanced 4-way pulse around the full-width header image */
        @keyframes movingWaveGlow {
            0% {
                box-shadow: 0px 0px 25px rgba(45, 212, 191, 0.6);
            }
            50% {
                box-shadow: 0px 0px 45px rgba(45, 212, 191, 0.9), 
                            0px 0px 20px rgba(45, 212, 191, 0.4);
            }
            100% {
                box-shadow: 0px 0px 25px rgba(45, 212, 191, 0.6);
            }
        }

        /* FIXED: Restored layout image size to exactly 1120px to match the boxes below perfectly */
        .header-logo-graphic {
            width: 1120px; 
            height: auto;
            object-fit: contain;
            display: block;
            border-radius: 4px;
            animation: movingWaveGlow 3s ease-in-out infinite alternate; 
        }

        /* --- Full-width ribbon layout with reduced height (tight padding) --- */
        .admin-custom-code-gap {
            width: 100%;
            background-color: rgb(9, 9, 9);
            border: 4px solid black; 
            border-radius: 6px;
            padding: 4px 15px; 
            margin-bottom: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between; 
            align-items: center;
            margin-top: 10px; 
        }

        /* Styled Label sitting perfectly on the left side of the full-width box */
        .admin-label-text {
            color: #aaaaaa;
            font-weight: bold;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .inner-player-table {
            border-collapse: collapse;
            margin: 0;
            padding: 0;
        }

        .discord-comms-btn {
            display: block;
            vertical-align: middle;
            transition: transform 0.2s ease;
        }

        .discord-comms-btn:hover {
            transform: scale(1.15);
        }

        .moving-gold-text {
            color: #ffd700;
            font-weight: bold;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        /* --- Master Framework Wrapper with 4-Way Travelling Cyan Border Light --- */
        .tournament-center-container {
            position: relative; /* Required to lock the travelling glow pseudo-element behind it */
            width: 100%;
            background-color: rgb(17, 17, 17);
            border: none; /* FIXED: Removed solid black borders so light travels across all 4 sides */
            border-radius: 8px;
            box-sizing: border-box;
            margin-top: -20px; 
            overflow: hidden; /* Clips the spinning gradient to only show on the border profile */
            /* Baseline atmospheric ambient glow matching your original grey styling */
            box-shadow: 0 0 15px rgba(128, 128, 128, 0.2), 
                        0 0 25px rgba(128, 128, 128, 0.1);
        }

        /* Keyframes animation that physically rotates the traveling light beam path clockwise */
        @keyframes travelBorder {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* FIXED: Amplified container canvas bounds (width/height 300%) to ensure light travels smoothly over the widescreen top and bottom edges */
        .tournament-center-container::before {
            content: '';
            position: absolute;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            /* A clean stream of Cyan (#2dd4bf) light fading into transparent black space */
            background: conic-gradient(
                from 0deg,
                transparent 75%,
                #2dd4bf 92%,
                #2dd4bf 98%,
                transparent 100%
            );
            animation: travelBorder 8s linear infinite; /* 8s gives a smoother cinematic speed over the larger top/bottom run */
            z-index: 1;
        }

        /* FIXED: Masking layer leaves an explicit 4px frame track around ALL 4 borders (top, bottom, left, right) */
        .tournament-center-container::after {
            content: '';
            position: absolute;
            inset: 4px; /* Creates the uniform glowing neon path thickness all the way around */
            background: rgb(17, 17, 17);
            border-radius: 6px;
            z-index: 2;
        }

        /* --- Master Z-Index Safety Reset for Table Content Layout Elements --- */
        /* Forces all interior layout columns to render safely on top of the travelling border rays background */
        .tournament-center-container > * {
            position: relative;
            z-index: 3;
            /* FIXED: Re-applied internal grid structure buffers to replace the old heavy black borders safely */
            padding-left: 20px;
            padding-right: 20px;
        }

        /* --- Header Spacer Bar Section --- */
        .banner-divider-bar {
            width: 100%;
            background-color: black;
            padding: 10px 0px;
            box-sizing: border-box;
        }

        /* --- Bottom Layout Spacer Block --- */
        .bottom-divider-bar {
            width: 100%;
            background-color: black;
            height: 15px;
            box-sizing: border-box;
        }

        /* --- Standard 2014 Table Row Framework Grid Architecture --- */
        .classic-layout-row-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 15px; /* Handles all gap spacing mathematically */
        }

        .layout-box-cell {
            background-color: rgb(9, 9, 9);
            border: 4px solid black;
            padding: 0px 15px 15px 15px;
            vertical-align: top;
            box-sizing: border-box;
        }

        /* --- COLUMN 1: LEFT TOURNAMENT MENU BOX --- */
        .left-menu-cell {
            width: 160px;
            background-color: transparent;
            border: none;
            padding: 0;
            vertical-align: top;
        }

        .nav-btn-link {
            font-size: 16px;
            color: rgb(255, 255, 255);
            width: 160px;
            background-color: rgb(29, 29, 29);
            display: block;
            text-decoration: none;
            margin-bottom: 13px;
            border: 3px solid rgb(0, 0, 0);
            padding: 6px 0px;
            text-align: center;
            font-weight: 700;
            box-sizing: border-box;
            cursor: pointer;
        }

        /* Hover states matching the sleek grey look */
        .nav-btn-link:hover, .nav-btn-link.active {
            border-color: #888888 !important;
            color: #ffffff !important;
            background-color: rgb(40, 40, 40) !important;
        }

        .form-heading-main {
            text-align: center;
            color: #aaaaaa; 
            font-size: 18px;
            border-bottom: 1px solid rgb(51, 51, 51);
            padding-bottom: 4px;
            width: 100%;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        /* --- Inputs, Form Elements, Labels --- */
        .input-label-classic {
            font-size: 13px;
            color: rgb(204, 204, 204);
            padding-top: 6px;
            padding-bottom: 2px;
            display: block;
        }

        .input-text-field-classic {
            text-align: left;
            background-color: rgb(34, 34, 34);
            color: rgb(170, 170, 170);
            font-size: 13px;
            width: 100%;
            height: 24px;
            border: 1px solid rgb(120, 120, 120);
            padding: 2px 4px;
            box-sizing: border-box;
            font-family: 'Orbitron', sans-serif;
        }

        .form-textarea-classic {
            text-align: left; 
            background-color: rgb(34, 34, 34); 
            color: rgb(170, 170, 170); 
            font-size: 13px; 
            width: 100%; 
            height: 78px; 
            border: 1px solid rgb(120, 120, 120); 
            padding: 2px 4px; 
            box-sizing: border-box; 
            font-family: inherit; 
            resize: none;
        }

        .form-submit-btn {
            width: 100%; 
            height: 35px; 
            background-color: #27272a; 
            color: #aaaaaa; 
            border: 1px solid #888888; 
            cursor: pointer; 
            font-family: inherit; 
            font-weight: bold;
        }

        /* --- Content Panels & Scroll Lists --- */
        .announcements-text-area {
            width: 100%;
            height: 200px;
            overflow-y: auto;
            color: rgb(170, 170, 170);
            font-size: 12px;
            line-height: 1.6;
            box-sizing: border-box;
            padding: 5px;
            scroll-behavior: smooth;
        }

        .scrollable-inner-list {
            width: 100%; 
            height: 320px; 
            overflow: auto; 
            background-color: rgb(17, 17, 17); 
            border: 2px solid black; 
            padding: 5px; 
            box-sizing: border-box;
        }

        .leaderboard-ordered-list {
            color: rgb(170, 170, 170); 
            text-align: left; 
            font-size: 11px; 
            padding-left: 22px; 
            margin: 0px; 
            white-space: nowrap; 
            overflow: hidden;
        }

        /* Custom Scrollbars */
        .announcements-text-area::-webkit-scrollbar,
        .scrollable-inner-list::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .announcements-text-area::-webkit-scrollbar-track,
        .scrollable-inner-list::-webkit-scrollbar-track {
            background: #090909;
        }
        .announcements-text-area::-webkit-scrollbar-thumb,
        .scrollable-inner-list::-webkit-scrollbar-thumb {
            background: #555555;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <div class="master-layout-alignment-block">
        <!-- HEADER CONTAINER WITH THE BALANCED INTERACTIVE HALO GLOW -->
        <header class="main-top-header">
            <img src="8brcamBanner1.jpg" alt="8brcam Tournament Banner Logo" class="header-logo-graphic" loading="lazy">
        </header>

        <!-- Full-width ribbon layout with fixed margin padding alignment -->
        <div class="admin-custom-code-gap">
            <span class="admin-label-text">Admin:</span>
            <table class="inner-player-table">
                <tr>
                    <td style="padding-right: 8px !important;">
                        <a href="https://discord.com/users/1368339128491442196" target="_blank" title="Click to message this player to arrange your group stage match">
                            <img src="https://github.com/8brcam/Groups/blob/main/Discordd-Photoroom.png?raw=true" width="18" height="18" class="discord-comms-btn">
                        </a>
                    </td>
                    <td><span class="moving-gold-text">Kevin likes ladyboys</span></td>
                </tr>
            </table>
        </div>

        <!-- Master Framework Wrapper -->
        <div class="tournament-center-container">
            <div class="banner-divider-bar"></div>
            
            <!-- ROW 1 TABLE CONTEXT BLOCK -->
            <table class="classic-layout-row-table">
                <tr>
                    <!-- COLUMN 1: LEFT NAVIGATION MENU CELL -->
                    <td class="left-menu-cell">
                        <a href="./Rules/" target="content-frame" class="nav-btn-link active" onclick="switchTab(this)">Rules</a>
                        <a href="./Groups/" target="content-frame" class="nav-btn-link" onclick="switchTab(this)">Groups</a>
                        <a href="./Playoffs/" target="content-frame" class="nav-btn-link" onclick="switchTab(this)">Playoffs</a>
                        <a href="./Archives/" target="content-frame" class="nav-btn-link" onclick="switchTab(this)">Archives</a>
                        <a href="./Application/" target="content-frame" class="nav-btn-link" onclick="switchTab(this)">Application</a>
                        <a href="./Videos/" target="content-frame" class="nav-btn-link" onclick="switchTab(this)">Videos</a>
                        <a href="./Forum/" target="content-frame" class="nav-btn-link" onclick="switchTab(this)">Forum</a>
                    </td>

                    <!-- COLUMN 2: CENTER MATCH SUBMISSION BOX -->
                    <td class="layout-box-cell" style="width: 45%; height: 263px;">
                        <h2 class="form-heading-main">Set Report Form</h2>
                        <form action="#" method="post" enctype="multipart/form-data">
                            <div>
                                <label class="input-label-classic">Winner vs Loser with Score *</label>
                                <input name="element_0" class="input-text-field-classic" type="text" value=""/>
                            </div>
                            <div>
                                <label class="input-label-classic">Group *</label>
                                <input name="element_1" class="input-text-field-classic" type="text" value=""/>
                            </div>
                            <div>
                                <label class="input-label-classic">Video Download Link *</label>
                                <input name="element_2" class="input-text-field-classic" type="text" value=""/>
                            </div>
                            <div>
                                <label class="input-label-classic">Message</label>
                                <textarea rows="5" name="element_3" class="form-textarea-classic"></textarea>
                            </div>
                            <div style="margin-top:10px; display: flow-root;">
                                <input type="hidden" name="element_counts" value="4"/>
                                <input type="hidden" name="embed" value="forms"/>
                                <input type="submit" value="SUBMIT" class="form-submit-btn"/>
                            </div>
                        </form>
                    </td>

                    <!-- COLUMN 3: RIGHT ANNOUNCEMENTS BOX -->
                    <td class="layout-box-cell" style="width: 55%; height: 263px;">
                        <h2 class="form-heading-main">Announcements</h2>
                        <div class="announcements-text-area">
                            Welcome to the arena. Type your announcements here.
                        </div>
                    </td>
                </tr>
            </table>
            <!-- ROW 2 TABLE CONTEXT BLOCK -->
            <table class="classic-layout-row-table" style="margin-top: -5px;">
                <tr>
                    <!-- PIECE 1: PLAYERS RECAP CANVAS BOX -->
                    <td class="layout-box-cell" style="width: 220px; height: 424px; min-width: 220px;">
                        <div style="height: 100%; display: flex; flex-direction: column; justify-content: space-between;">
                            <div>
                                <h2 class="form-heading-main" style="font-size: 16px; margin-top:0;">Previous Season Recap</h2>
                                <div class="scrollable-inner-list">
                                    <!-- Drop your future player list links or text elements directly right here -->
                                </div>
                            </div>
                            <div style="padding-top: 8px; border-top: 1px solid rgb(17, 17, 17); margin-top: auto;">
                                <span style="font-size: 11px; color: #888888;">Winner:</span> <b style="color: rgb(153,153,153); font-size:11px;"></b>
                            </div>
                        </div>
                    </td>

                    <!-- PIECE 2: FULL-FIT WIDGETBOT DISCORD PANEL WINDOW -->
                    <td class="layout-box-cell" style="padding: 0px; height: 424px; overflow: hidden;">
                        <iframe src="https://e.widgetbot.io/channels/1536340335666528349/1536340336249405452" style="width: 100%; height: 100%; border: none; display: block; background: transparent;"></iframe>
                    </td>

                    <!-- RIGHT STACKED CONTAINERS CELLS -->
                    <td style="width: 240px; min-width: 240px; padding: 0; border: none; background: transparent; vertical-align: top;">
                        <table style="width: 100%; border-collapse: separate; border-spacing: 0;">
                            <tr>
                                <!-- PIECE 3: TOP 10 ALL TIME LEADERBOARD CONTAINER BOX -->
                                <td class="layout-box-cell" style="width: 100%; height: 260px; display: block;">
                                    <h2 class="form-heading-main" style="font-size: 16px;">Top 10 All Time</h2>
                                    <ol class="leaderboard-ordered-list">
                                        <!-- Drop your future top 10 leaderboard entries directly right here -->
                                    </ol>
                                </td>
                            </tr>
                            <tr><td style="height: 15px;"></td></tr>
                            <tr>
                                <!-- PIECE 4: BOTTOM RIGHT UTILITY CANVAS BOX -->
                                <td class="layout-box-cell" style="width: 100%; height: 149px; display: block; text-align: center; font-size: 12px; padding: 10px;">
                                    <!-- Drop your future bottom-right banner links or graphics widgets directly right here -->
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>

            <!-- This block inserts the exact required spacer gap before the master container's neon bottom border line closes -->
            <div class="bottom-divider-bar"></div>

        </div> <!-- Closes master tournament-center-container -->
    </div> <!-- Closes master-layout-alignment-block -->

    <!-- Navigation Active Tab Script Indicator -->
    <script>
        function switchTab(element) {
            const buttons = document.querySelectorAll('.nav-btn-link');
            buttons.forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }
    </script>
</body>
</html>
